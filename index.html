<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QW电竞 · 护航平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 样式与之前相同，省略以节省篇幅 ===== */
        /* 请保留你之前的完整样式，或者直接复制下面的完整版 */
    </style>
</head>
<body>
<!-- 页面结构不变，只修改 JavaScript 部分 -->
<script>
// ============================================================
//  配置
// ============================================================
const API_URL = 'https://qw-esports-backend.vercel.app/api';
let currentUser = null;
let token = localStorage.getItem('token');
let announceImages = [];

// ============================================================
//  工具函数（保持不变）
// ============================================================
function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type === 'error' ? ' error' : type === 'warning' ? ' warning' : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

function statusText(s) {
    const map = { 'pending': '待接单', 'ongoing': '进行中', 'review': '待验收', 'completed': '已完成', 'canceled': '已取消', 'rejected': '已驳回', 'onsale': '在售', 'soldout': '已售罄', 'hidden': '已下架', 'refund_pending': '退款申请中', 'refunded': '已退款' };
    return map[s] || s;
}

function statusClass(s) {
    if (s === 'hidden') return 'status-hidden';
    if (s === 'refund_pending') return 'status-refund_pending';
    if (s === 'refunded') return 'status-refunded';
    return 'status-' + s;
}

async function apiRequest(url, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(token ? { 'Authorization': token } : {}), ...options.headers };
    const res = await fetch(API_URL + url, { ...options, headers });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || '请求失败');
    }
    return res.json();
}

function showCustomModal(html) {
    document.getElementById('customModalContent').innerHTML = html;
    document.getElementById('customModal').classList.add('active');
}

function closeCustomModal() {
    document.getElementById('customModal').classList.remove('active');
}

function confirmAction(title, message, confirmText, callback) {
    showCustomModal(`
        <h3>${title}</h3>
        <p>${message}</p>
        <div class="btn-row">
            <button class="btn btn-outline" onclick="closeCustomModal()">取消</button>
            <button class="btn btn-success" onclick="closeCustomModal();${callback}">${confirmText}</button>
        </div>
    `);
}

function updateRoleBasedUI() {
    if (!currentUser) return;
    const role = currentUser.role;
    document.getElementById('cardBoss').style.display = (role === 'boss' || role === 'admin') ? 'block' : 'none';
    document.getElementById('cardHandler').style.display = (role === 'handler' || role === 'admin') ? 'block' : 'none';
    document.getElementById('cardAdmin').style.display = (role === 'admin') ? 'block' : 'none';
    document.getElementById('cardAccount').style.display = 'block';
    document.getElementById('navBoss').style.display = (role === 'boss' || role === 'admin') ? 'flex' : 'none';
    document.getElementById('navHandler').style.display = (role === 'handler' || role === 'admin') ? 'flex' : 'none';
    document.getElementById('navAdmin').style.display = (role === 'admin') ? 'flex' : 'none';
    document.getElementById('navAccount').style.display = 'flex';
    document.getElementById('navHome').style.display = 'flex';
}

// ============================================================
//  公告功能（保持不变）
// ============================================================
async function loadAnnounce() {
    try {
        const data = await fetch(API_URL + '/announce').then(r => r.json());
        document.getElementById('announceContent').textContent = data.content || '欢迎使用 QW电竞护航平台！';
        const imagesContainer = document.getElementById('announceImages');
        imagesContainer.innerHTML = '';
        if (data.images && data.images.length > 0) {
            data.images.forEach(img => {
                const imgEl = document.createElement('img');
                imgEl.src = img;
                imagesContainer.appendChild(imgEl);
            });
        }
        if (data.updatedAt) {
            document.getElementById('announceTime').textContent = '更新于：' + new Date(data.updatedAt).toLocaleString();
        }
        document.getElementById('announceEditContent').value = data.content || '';
        announceImages = data.images || [];
        renderAnnounceImagePreview();
        document.getElementById('announcePreview').innerHTML = (data.content || '') + (data.images && data.images.length > 0 ? '<br><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">' + data.images.map(img => '<img src="'+img+'" style="max-width:80px;max-height:80px;border-radius:8px;">').join('') + '</div>' : '');
    } catch (err) { console.error('加载公告失败', err); }
}

function previewAnnounceImages(event) {
    const files = event.target.files;
    for (let file of files) {
        const reader = new FileReader();
        reader.onload = function(e) {
            announceImages.push(e.target.result);
            renderAnnounceImagePreview();
        };
        reader.readAsDataURL(file);
    }
    event.target.value = '';
}

function removeAnnounceImage(index) {
    announceImages.splice(index, 1);
    renderAnnounceImagePreview();
}

function renderAnnounceImagePreview() {
    const container = document.getElementById('announceImagePreview');
    container.innerHTML = announceImages.map((img, i) =>
        `<div style="position:relative;display:inline-block;">
            <img src="${img}" style="max-width:60px;max-height:60px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);">
            <button onclick="removeAnnounceImage(${i})" style="position:absolute;top:-6px;right:-6px;background:#ef4444;border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;cursor:pointer;line-height:18px;text-align:center;">×</button>
        </div>`
    ).join('');
}

async function saveAnnounce() {
    const content = document.getElementById('announceEditContent').value.trim();
    if (!content) return toast('请输入公告内容', 'warning');
    try {
        await apiRequest('/admin/announce', { method: 'PUT', body: JSON.stringify({ content, images: announceImages }) });
        toast('公告已更新', 'success');
        loadAnnounce();
    } catch (err) {
        toast(err.message, 'error');
    }
}

// ============================================================
//  认证模块（保持不变）
// ============================================================
async function doAuthLogin() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    const errorEl = document.getElementById('authError');
    errorEl.textContent = '';
    if (!username || !password) {
        errorEl.textContent = '请填写用户名和密码';
        return;
    }
    try {
        const data = await apiRequest('/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        token = data.token;
        localStorage.setItem('token', token);
        currentUser = data.user;
        document.getElementById('authPage').style.display = 'none';
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('currentUserDisplay').textContent = currentUser.username + ' (' + currentUser.role + ')';
        document.querySelectorAll('.role-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('view-home').classList.add('active');
        document.querySelector('.bottom-nav .nav-item[data-target="home"]').classList.add('active');
        updateRoleBasedUI();
        loadAnnounce();
        updateAccountInfo();
        document.getElementById('authUsername').value = '';
        document.getElementById('authPassword').value = '';
        toast('欢迎回来，' + username, 'success');
    } catch (err) {
        errorEl.textContent = err.message || '登录失败';
    }
}

async function doAuthRegister() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    const role = document.querySelector('input[name="authRole"]:checked').value;
    const errorEl = document.getElementById('authError');
    errorEl.textContent = '';
    if (!username || !password) {
        errorEl.textContent = '请填写用户名和密码';
        return;
    }
    try {
        await apiRequest('/register', { method: 'POST', body: JSON.stringify({ username, password, role, phone: '', game: '' }) });
        toast('注册成功，请登录', 'success');
        document.getElementById('authPassword').value = password;
        doAuthLogin();
    } catch (err) {
        errorEl.textContent = err.message || '注册失败';
    }
}

function logout() {
    confirmAction('确认退出', '确定要退出登录吗？', '确认退出', `doLogout()`);
}

function doLogout() {
    localStorage.removeItem('token');
    token = null;
    currentUser = null;
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('authPage').style.display = 'flex';
    document.getElementById('currentUserDisplay').textContent = '未登录';
    toast('已退出', 'warning');
}

function updateAccountInfo() {
    if (!currentUser) return;
    document.getElementById('accUsername').textContent = currentUser.username;
    document.getElementById('accRole').textContent = currentUser.role === 'boss' ? '老板' : currentUser.role === 'handler' ? '打手' : '管理员';
    document.getElementById('accStatus').textContent = currentUser.status === 'active' ? '正常' : '封禁';
    document.getElementById('accDiamond').textContent = currentUser.diamond || 0;
    document.getElementById('accBalance').textContent = '¥' + (currentUser.balance || 0);
    document.getElementById('accDiamondRow').style.display = currentUser.role === 'boss' || currentUser.role === 'admin' ? 'flex' : 'none';
    document.getElementById('accBalanceRow').style.display = currentUser.role === 'handler' || currentUser.role === 'admin' ? 'flex' : 'none';
}

// ============================================================
//  导航切换（保持不变）
// ============================================================
document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
    item.addEventListener('click', function() {
        if (!currentUser) return toast('请先登录', 'warning');
        const target = this.dataset.target;
        if (this.style.display === 'none') return;
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.role-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        if (target === 'home') {
            document.getElementById('view-home').classList.add('active');
            loadAnnounce();
            return;
        }
        const viewMap = { 'boss': 'view-boss', 'handler': 'view-handler', 'admin': 'view-admin', 'account': 'view-account' };
        const viewId = viewMap[target];
        if (viewId) {
            document.getElementById(viewId).classList.add('active');
            if (target === 'boss') renderBossView();
            else if (target === 'handler') renderHandlerView();
            else if (target === 'admin') renderAdminAll();
            else if (target === 'account') updateAccountInfo();
        }
    });
});

document.querySelectorAll('.entry-card[data-target]').forEach(card => {
    card.addEventListener('click', function() {
        if (!currentUser) return toast('请先登录', 'warning');
        const target = this.dataset.target;
        if (this.style.display === 'none') return;
        document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
        const navItem = document.querySelector(`.bottom-nav .nav-item[data-target="${target}"]`);
        if (navItem && navItem.style.display !== 'none') navItem.click();
    });
});

// ============================================================
//  管理员渲染（保持不变）
// ============================================================
document.querySelectorAll('.tab-nav button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
        document.getElementById(this.dataset.tab).classList.add('active');
        const tab = this.dataset.tab;
        if (tab === 'tab-dashboard') renderDashboard();
        else if (tab === 'tab-products') renderProducts();
        else if (tab === 'tab-orders') renderAdminOrders();
        else if (tab === 'tab-recharges') renderRecharges();
        else if (tab === 'tab-users') renderUsers();
        else if (tab === 'tab-announce') loadAnnounce();
    });
});

async function renderAdminAll() {
    await renderDashboard();
    await renderProducts();
    await renderAdminOrders();
    await renderRecharges();
    await renderUsers();
    await populateGiftUsers();
}

async function renderDashboard() {
    try {
        const orders = await apiRequest('/admin/orders');
        document.getElementById('statsGrid').innerHTML = `
            <div class="admin-card" style="padding:12px;text-align:center;"><div style="font-size:22px;font-weight:700;">${orders.length}</div><div style="font-size:12px;color:#8892a8;">总订单</div></div>
            <div class="admin-card" style="padding:12px;text-align:center;"><div style="font-size:22px;font-weight:700;color:#f59e0b;">${orders.filter(o=>o.status==='pending').length}</div><div style="font-size:12px;color:#8892a8;">待接单</div></div>
            <div class="admin-card" style="padding:12px;text-align:center;"><div style="font-size:22px;font-weight:700;color:#22c55e;">${orders.filter(o=>o.status==='completed').length}</div><div style="font-size:12px;color:#8892a8;">已完成</div></div>
        `;
        const recent = orders.slice(0, 5);
        const container = document.getElementById('recentOrdersList');
        if (recent.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无订单</p></div>'; return; }
        let html = '<div class="table-wrap"><table><thead><tr><th>订单号</th><th>金额</th><th>状态</th></tr></thead><tbody>';
        recent.forEach(o => {
            html += `<tr><td>${o.id}</td><td>¥${o.price}</td><td><span class="status-badge ${statusClass(o.status)}">${statusText(o.status)}</span></td></tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (err) { console.error(err); }
}

// ===== 商品管理 =====
async function renderProducts() {
    try {
        const products = await apiRequest('/admin/products');
        const container = document.getElementById('productsList');
        if (products.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-box-open"></i><p>暂无商品</p></div>';
            return;
        }
        let html = '<div class="table-wrap"><table><thead><tr><th>标题</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody>';
        for (const p of products) {
            const remaining = p.quantity - p.sold;
            const isHidden = p.hidden === true;
            let statusText2 = isHidden ? '已下架' : (remaining > 0 ? '在售' : '已售罄');
            let statusCls = isHidden ? 'status-hidden' : (remaining > 0 ? 'status-onsale' : 'status-soldout');
            const productId = p._id || p.id;
            let actions = '';
            if (isHidden) {
                actions += `<button class="btn btn-success btn-xs" onclick="confirmReshelf('${productId}')">重新上架</button>`;
                actions += `<button class="btn btn-danger btn-xs" onclick="confirmDeleteProduct('${productId}')">删除</button>`;
            } else {
                actions += `<button class="btn btn-danger btn-xs" onclick="confirmUnshelf('${productId}')">下架</button>`;
            }
            html += `<tr>
                <td>${p.title}</td>
                <td>¥${p.price}</td>
                <td>${p.sold}/${p.quantity}</td>
                <td><span class="status-badge ${statusCls}">${statusText2}</span></td>
                <td><div class="action-group">${actions}</div></td>
            </tr>`;
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (err) { console.error(err); }
}

// 下架
window.confirmUnshelf = function(productId) {
    confirmAction('确认下架', '确认下架此商品？下架后老板将无法购买。', '确认下架', `doUnshelf('${productId}')`);
};
async function doUnshelf(productId) {
    try {
        await apiRequest('/admin/products/' + productId + '/unshelf', { method: 'PUT' });
        toast('商品已下架', 'success');
        renderProducts();
    } catch (err) { toast(err.message, 'error'); }
}

// 重新上架
window.confirmReshelf = function(productId) {
    confirmAction('确认重新上架', '确认重新上架此商品？', '确认上架', `doReshelf('${productId}')`);
};
async function doReshelf(productId) {
    try {
        await apiRequest('/admin/products/' + productId + '/reshelf', { method: 'PUT' });
        toast('商品已重新上架', 'success');
        renderProducts();
    } catch (err) { toast(err.message, 'error'); }
}

// 删除商品
window.confirmDeleteProduct = function(productId) {
    confirmAction('确认删除', '确认永久删除此商品？此操作不可恢复。', '确认删除', `doDeleteProduct('${productId}')`);
};
async function doDeleteProduct(productId) {
    try {
        await apiRequest('/admin/products/' + productId, { method: 'DELETE' });
        toast('商品已删除', 'success');
        renderProducts();
    } catch (err) { toast(err.message, 'error'); }
}

async function shelfProduct() {
    const game = document.getElementById('prodGame').value;
    const title = document.getElementById('prodTitle').value.trim();
    const desc = document.getElementById('prodDesc').value.trim();
    const price = parseFloat(document.getElementById('prodPrice').value);
    const quantity = parseInt(document.getElementById('prodQuantity').value) || 1;
    if (!title || !price) return toast('请填写完整信息', 'error');
    try {
        await apiRequest('/admin/products', { method: 'POST', body: JSON.stringify({ game, title, desc, price, quantity }) });
        toast('商品上架成功', 'success');
        document.getElementById('prodTitle').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodPrice').value = '';
        renderProducts();
    } catch (err) { toast(err.message, 'error'); }
}

// ============================================================
//  直接发布订单（修复版）
// ============================================================
window.directPublishOrder = function() {
    const game = document.getElementById('directGame').value;
    const title = document.getElementById('directTitle').value.trim();
    const desc = document.getElementById('directDesc').value.trim();
    const price = parseFloat(document.getElementById('directPrice').value);
    if (!title || !price) return toast('请填写完整信息', 'error');
    showCustomModal(`
        <h3><i class="fas fa-paper-plane"></i> 发布订单</h3>
        <p style="color:#8892a8;font-size:14px;">确认发布订单「${title}」到打手页面？</p>
        <div style="font-size:13px;color:#8892a8;margin-bottom:12px;">老板ID（留空则使用管理员）：<br><input class="admin-form-control" id="directBossId" placeholder="输入老板ID（可选）" style="margin-top:6px;"></div>
        <div class="btn-row">
            <button class="btn btn-outline" onclick="closeCustomModal()">取消</button>
            <button class="btn btn-success" onclick="doDirectPublish('${game}', '${title}', '${desc}', ${price})">确认发布</button>
        </div>
    `);
};

async function doDirectPublish(game, title, desc, price) {
    const bossId = document.getElementById('directBossId')?.value.trim() || '';
    closeCustomModal();
    try {
        const data = await apiRequest('/admin/orders/direct', {
            method: 'POST',
            body: JSON.stringify({ game, title, desc, price, bossId })
        });
        toast('✅ 订单已发布，打手可接单', 'success');
        document.getElementById('directTitle').value = '';
        document.getElementById('directDesc').value = '';
        document.getElementById('directPrice').value = '';
        renderAdminOrders();
        renderHandlerView();
    } catch (err) {
        toast(err.message, 'error');
    }
}

// ============================================================
//  订单管理（管理员）
// ============================================================
async function renderAdminOrders() {
    try {
        const orders = await apiRequest('/admin/orders');
        const container = document.getElementById('adminOrdersList');
        if (orders.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无订单</p></div>';
            return;
        }
        let html = '<div class="table-wrap"><table><thead><tr><th>订单号</th><th>标题</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody>';
        for (const o of orders) {
            let actions = '';
            if (o.status === 'pending') actions += `<button class="btn btn-success btn-xs" onclick="adminAssignHandler('${o.id}')">指派</button>`;
            if (o.status === 'ongoing') {
                actions += `<button class="btn btn-warning btn-xs" onclick="adminForceComplete('${o.id}')">强制完成</button>`;
                actions += `<button class="btn btn-danger btn-xs" onclick="adminCancelOrder('${o.id}')">取消</button>`;
            }
            if (o.status === 'review') {
                actions += `<button class="btn btn-success btn-xs" onclick="adminConfirmComplete('${o.id}')">确认</button>`;
                actions += `<button class="btn btn-danger btn-xs" onclick="adminRejectOrder('${o.id}')">驳回</button>`;
            }
            if (o.status === 'completed') {
                actions += `<button class="btn btn-primary btn-xs" onclick="adminSettleOrder('${o.id}')">结算</button>`;
            }
            if (o.status === 'refund_pending') {
                actions += `<button class="btn btn-success btn-xs" onclick="adminRefundApprove('${o.id}')">通过退款</button>`;
                actions += `<button class="btn btn-danger btn-xs" onclick="adminRefundReject('${o.id}')">拒绝退款</button>`;
            }
            html += `<tr>
                <td>${o.id}</td>
                <td>${o.title}</td>
                <td>¥${o.price}</td>
                <td><span class="status-badge ${statusClass(o.status)}">${statusText(o.status)}</span></td>
                <td><div class="action-group">${actions}</div></td>
            </tr>`;
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (err) { console.error(err); }
}

window.adminAssignHandler = function(orderId) {
    const handlerId = prompt('请输入打手ID：');
    if (!handlerId) return;
    apiRequest('/admin/orders/' + orderId + '/assign', { method: 'PUT', body: JSON.stringify({ handlerId }) })
        .then(() => { toast('指派成功', 'success'); renderAdminOrders(); })
        .catch(err => toast(err.message, 'error'));
};

window.adminForceComplete = function(orderId) {
    confirmAction('确认强制完成', '确认强制完成此订单？', '确认强制完成', `doForceComplete('${orderId}')`);
};
async function doForceComplete(orderId) {
    try {
        await apiRequest('/admin/orders/' + orderId + '/force-complete', { method: 'PUT' });
        toast('强制完成成功', 'success');
        renderAdminOrders();
    } catch (err) { toast(err.message, 'error'); }
}

window.adminConfirmComplete = function(orderId) {
    confirmAction('确认验收通过', '确认此订单验收通过？', '确认通过', `doConfirmComplete('${orderId}')`);
};
async function doConfirmComplete(orderId) {
    try {
        await apiRequest('/admin/orders/' + orderId + '/confirm', { method: 'PUT' });
        toast('验收通过', 'success');
        renderAdminOrders();
    } catch (err) { toast(err.message, 'error'); }
}

window.adminRejectOrder = function(orderId) {
    const reason = prompt('请输入驳回原因：');
    if (reason === null) return;

async function renderRecharges() {

                actions += `<button class="btn btn-success btn-xs" onclick="confirmApproveRecharge('${r._id}')">通过</button>`;

    } catch (err) { console.error(err); }
}

        <p style="color:#8892a8;font-size:14px;">选择充值档位，提交后等待管理员审核。</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;">
            ${rechargeOptions.map(opt => `<div class="recharge-option" onclick="selectRecharge(this, ${opt.amount}, ${opt.diamond})">
                <div style="font-weight:600;font-size:16px;">¥${opt.amount}</div>
                <div style="font-size:12px;color:#8892a8;">${opt.diamond} 红钻</div>
            </div>`).join('')}
        </div>
        <div style="text-align:center;margin:8px 0;"><span id="selectedRecharge" style="color:#f5c842;">请选择档位</span></div>
        <div class="btn-row">
            <button class="btn btn-outline" onclick="closeRecharge()">取消</button>
            <button class="btn btn-success" id="submitRechargeBtn" disabled>提交充值</button>
        </div>
    `;
    document.getElementById('customModalContent').innerHTML = html;
    document.getElementById('customModal').classList.add('active');
    document.getElementById('submitRechargeBtn').addEventListener('click', submitRecharge);
};
window.selectRecharge = function(el, amount, diamond) {
    document.querySelectorAll('.recharge-option').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
    selectedRecharge = { amount, diamond };
    document.getElementById('selectedRecharge').textContent = `已选 ¥${amount} → ${diamond} 红钻`;
    document.getElementById('submitRechargeBtn').disabled = false;
};
function submitRecharge() {
    if (!selectedRecharge) return toast('请选择档位', 'warning');
    apiRequest('/recharges', { method: 'POST', body: JSON.stringify({ amount: selectedRecharge.amount, diamond: selectedRecharge.diamond }) })
        .then(() => { closeRecharge(); toast('充值申请已提交', 'success'); renderBossView(); })
        .catch(err => toast(err.message, 'error'));
}
window.closeRecharge = function() {
    document.getElementById('customModal').classList.remove('active');
    selectedRecharge = null;
};

// ============================================================
//  邮件
// ============================================================
window.openMail = function() {
    apiRequest('/mails').then(mails => {
        let listHtml = mails.length === 0 ? '<div class="empty-state"><i class="fas fa-envelope"></i><p>暂无邮件</p></div>' :
            mails.map(m => `
                <div class="mail-item">
                    <div style="display:flex;justify-content:space-between;">
                        <span class="mail-title">${m.title}</span>
                        <span class="mail-status"><span class="status-badge ${m.status==='unread'?'status-pending':'status-claimed'}">${m.status==='unread'?'未领取':'已领取'}</span></span>
                    </div>
                    <div style="font-size:14px;color:#b0b8c8;padding:4px 0;">${m.content}</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8892a8;">
                        <span>${m.createTime}</span>
                        ${m.status === 'unread' && m.diamond > 0 ? `<button class="btn btn-success btn-xs" onclick="confirmClaimMail('${m._id}')">领取 ${m.diamond} 红钻</button>` : ''}
                    </div>
                </div>
            `).join('');
        showCustomModal(`
            <h3><i class="fas fa-envelope"></i> 我的邮件</h3>
            <div style="margin-top:12px;max-height:400px;overflow-y:auto;">${listHtml}</div>
            <div class="btn-row"><button class="btn btn-outline" onclick="closeCustomModal()">关闭</button></div>
        `);
    }).catch(err => toast(err.message, 'error'));
};
window.confirmClaimMail = function(mailId) {
    confirmAction('领取红钻', '确认领取此邮件中的红钻？', '确认领取', `doClaimMail('${mailId}')`);
};
async function doClaimMail(mailId) {
    try {
        await apiRequest('/mails/' + mailId + '/claim', { method: 'PUT' });
        toast('领取成功', 'success');
        openMail();
        renderBossView();
    } catch (err) { toast(err.message, 'error'); }
}

// ============================================================
//  聊天
// ============================================================
window.openChat = function(orderId) {
    apiRequest('/orders/my').then(orders => {
        const order = orders.find(o => o._id === orderId);
        if (!order) return toast('订单不存在', 'error');
        const isEnded = ['completed','canceled','rejected','refunded'].includes(order.status);
        const messagesHtml = order.messages && order.messages.length > 0 ?
            order.messages.map(msg => {
                const senderName = msg.sender === 'boss' ? '老板' : msg.sender === 'handler' ? '打手' : '系统';
                const senderClass = msg.sender === 'boss' ? 'boss' : msg.sender === 'handler' ? 'handler' : 'system';
                return `<div class="chat-msg ${senderClass}"><strong>${senderName}:</strong> ${msg.content} <span class="time">${msg.time}</span></div>`;
            }).join('') :
            '<div class="empty-state"><p>暂无消息</p></div>';
        showCustomModal(`
            <h3><i class="fas fa-comment"></i> 订单 ${orderId} 聊天</h3>
            <p style="font-size:13px;color:#8892a8;">${order.game} · ${order.title}</p>
            <p style="font-size:12px;color:#5a6378;">状态：${statusText(order.status)} ${isEnded ? '（已结束，只读）' : ''}</p>
            <div class="chat-messages" id="chatMessages">${messagesHtml}</div>
            <div class="${isEnded ? 'chat-readonly' : ''}">
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="${isEnded ? '订单已结束' : '输入消息...'}" ${isEnded ? 'disabled' : ''}>
                    <button class="btn btn-primary btn-sm" id="chatSendBtn" ${isEnded ? 'disabled' : ''}><i class="fas fa-paper-plane"></i> 发送</button>
                </div>
            </div>
            <div class="btn-row"><button class="btn btn-outline" onclick="closeCustomModal()">关闭</button></div>
        `);
        document.getElementById('customModal').classList.add('active');
        const msgContainer = document.getElementById('chatMessages');
        if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;
        const sendBtn = document.getElementById('chatSendBtn');
        const input = document.getElementById('chatInput');
        if (sendBtn && input && !isEnded) {
            const sendMessage = function() {
                const text = input.value.trim();
                if (!text) return toast('请输入消息', 'warning');
                apiRequest('/orders/' + orderId + '/chat', { method: 'POST', body: JSON.stringify({ content: text }) })
                    .then(() => { openChat(orderId); toast('消息已发送', 'success'); })
                    .catch(err => toast(err.message, 'error'));
            };
            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMessage(); });
        }
    }).catch(err => toast(err.message, 'error'));
};

// ============================================================
//  初始化
// ============================================================
async function init() {
    document.getElementById('authPage').style.display = 'flex';
    document.getElementById('mainApp').classList.add('hidden');

    if (token) {
        try {
            const user = await apiRequest('/me');
            currentUser = user;
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('currentUserDisplay').textContent = user.username + ' (' + user.role + ')';
            document.getElementById('view-home').classList.add('active');
            document.querySelector('.bottom-nav .nav-item[data-target="home"]').classList.add('active');
            updateRoleBasedUI();
            loadAnnounce();
            updateAccountInfo();
        } catch (err) {
            localStorage.removeItem('token');
            token = null;
            document.getElementById('authPage').style.display = 'flex';
            document.getElementById('mainApp').classList.add('hidden');
        }
    }
}

document.getElementById('logoutBtn').addEventListener('click', logout);

init();
console.log('✅ QW电竞护航平台已加载');
console.log('后端地址:', API_URL);
</script>
